name = "esp-anywhere-worker"
main = "src/index.ts"
compatibility_date = "2024-02-08"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = true

[dev]
port = 8788
local_protocol = "http"

[durable_objects]
bindings = [
  { name = "ESP_ANYWHERE_INSTALLATION", class_name = "InstallationDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstallationDO"]

[env.staging]
name = "esp-anywhere-worker-staging"
vars = { ARTIFACT_ORIGIN = "https://raw.githubusercontent.com/kaziksiwy-stack/esp-anywhere-ota/main" }

[[env.staging.durable_objects.bindings]]
name = "ESP_ANYWHERE_INSTALLATION"
class_name = "InstallationDO"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["InstallationDO"]

[[env.staging.kv_namespaces]]
binding = "ARTIFACTS"
id = "96b48eb93b8443c0a6e8c206243a3c3b"
