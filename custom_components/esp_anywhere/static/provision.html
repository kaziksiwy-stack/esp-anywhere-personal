<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP Anywhere — bezpieczne przekazanie</title><style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:680px;margin:0 auto;padding:24px;background:#10151d;color:#edf3fa}.card{background:#192330;border:1px solid #33465d;border-radius:16px;padding:22px;margin:16px 0}button{padding:12px 18px;border:0;border-radius:9px;background:#03a9f4;color:#00131d;font-weight:700;cursor:pointer}.muted{color:#a9b8c8}.error{color:#fecaca}</style></head>
<body><main class="card"><h1>Przygotuj urządzenie</h1><p>Konfiguracja jest gotowa. Otwórz bezpieczny flasher HTTPS, podłącz ESP32-C3 i postępuj według etapów.</p><button id="open">Otwórz flasher</button><p id="message" class="muted"></p></main>
<script>
const sessionId="__SESSION_ID__";const provisionOrigin="__PROVISION_ORIGIN__";const base=`/api/esp_anywhere/provision/${sessionId}`;const message=document.getElementById("message");let popup=null;let privateConfig=null;
async function getConfig(){if(privateConfig)return privateConfig;const response=await fetch(`${base}/config`,{cache:"no-store"});if(!response.ok)throw new Error("session");privateConfig=await response.json();return privateConfig;}
async function pollHA(){for(let attempt=0;attempt<60;attempt++){const response=await fetch(`${base}/status`,{cache:"no-store"});if(response.ok){const state=await response.json();if(state.visible){popup?.postMessage({type:"esp-anywhere-visible"},provisionOrigin);message.textContent="Gotowe — urządzenie jest widoczne w Home Assistant.";return;}}await new Promise(resolve=>setTimeout(resolve,2000));}message.textContent="Urządzenie jeszcze nie pojawiło się w HA. Sprawdź zasilanie i Wi‑Fi.";}
window.addEventListener("message",async event=>{if(event.origin!==provisionOrigin||event.source!==popup)return;try{if(event.data?.type==="esp-anywhere-ready"){const config=await getConfig();popup.postMessage({type:"esp-anywhere-config",config},provisionOrigin);privateConfig=null;message.textContent="Konfiguracja przekazana bezpośrednio do bezpiecznego flashera.";}if(event.data?.type==="esp-anywhere-discovery")await pollHA();}catch{message.className="error";message.textContent="Sesja wygasła lub została już użyta. Wróć do integracji i wybierz Dodaj urządzenie ponownie.";}});
document.getElementById("open").addEventListener("click",()=>{popup=window.open(provisionOrigin+"/provision","esp_anywhere_provision");if(!popup){message.className="error";message.textContent="Przeglądarka zablokowała nowe okno. Zezwól na wyskakujące okna i spróbuj ponownie.";return;}message.textContent="Czekam na bezpieczny flasher…";});
</script></body></html>
